[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-driven-dev"
dynamic = ["version"]
description = "Policy-driven software delivery with explicit authority boundaries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.23,<5",
]

[tool.setuptools.dynamic]
version = {attr = "sdd._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdd*"]
namespaces = false
